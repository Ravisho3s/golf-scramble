<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scramble Leaderboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B4332">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

<div id="alert-banner"></div>

<header class="topbar">
  <div class="topbar-inner">
    <h1><span class="flag-icon">⛳</span> Scramble Leaderboard</h1>
    <button id="notif-btn" class="notif-btn">🔕 Turn on alerts</button>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="tab-leaderboard">Leaderboard</button>
    <button class="tab-btn" data-tab="tab-scorecard">Scorecard</button>
    <button class="tab-btn" data-tab="tab-entry">Enter Score</button>
  </nav>
</header>

<main>
  <section id="tab-leaderboard" class="tab-panel active">
    <div id="leaderboard" class="leaderboard-board"></div>
    <p class="legend">
      <span class="legend-item"><span class="swatch eagle"></span>Eagle</span>
      <span class="legend-item"><span class="swatch birdie"></span>Birdie</span>
    </p>
  </section>

  <section id="tab-scorecard" class="tab-panel">
    <div id="scorecard-wrap"></div>
  </section>

  <section id="tab-entry" class="tab-panel">
    <p class="hint">Scorekeeper: pick your team, then enter strokes hole by hole.</p>
    <div id="team-picker" class="team-picker"></div>
    <div id="entry-area" class="entry-area"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
